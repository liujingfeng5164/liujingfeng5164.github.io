{{ define "main" }}
<div class="py-16 md:py-24 lg:py-32 px-6 md:px-10 lg:px-16">
  <article class="max-w-3xl mx-auto">
    <header class="mb-12 md:mb-16">
      <div class="flex items-center gap-2 mb-6">
        <span class="w-1 h-1 rounded-full bg-[#d4a5a5]"></span>
        <time class="font-sans font-light text-xs md:text-sm text-[#3d4a5c]/60" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
      </div>
      <h1 class="font-light tracking-wide text-2xl md:text-4xl leading-tight">{{ .Title }}</h1>
    </header>

    <div class="prose prose-slate max-w-[65ch] font-light prose-headings:font-light prose-headings:tracking-wide prose-p:leading-loose prose-a:text-[#3d4a5c]">
      {{ .Content }}
    </div>

    {{ with .GetTerms "tags" }}
    <div class="mt-12 flex flex-wrap items-center gap-2">
      {{ range . }}
        <a href="{{ .RelPermalink }}" class="rounded-full border border-[#3d4a5c]/10 px-3 py-1 font-sans font-light text-xs text-[#3d4a5c]/60 hover:text-[#3d4a5c] hover:border-[#3d4a5c]/20 transition-all duration-300 ease-in-out"># {{ .LinkTitle }}</a>
      {{ end }}
    </div>
    {{ end }}

    <footer class="mt-16 md:mt-20 pt-8 border-t border-[#3d4a5c]/10">
      <a href="{{ "/posts/" | relURL }}" class="font-sans font-light text-xs md:text-sm text-[#3d4a5c]/60 hover:text-[#3d4a5c] transition-all duration-300 ease-in-out">← 返回列表</a>
    </footer>
  </article>
</div>
{{ end }}
